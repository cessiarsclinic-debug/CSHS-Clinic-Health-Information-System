<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSHS Clinic Health Information System</title>
<style>
:root{--g:#2f5233;--g2:#3f6b44;--bg:#f3f6f1;--card:#fff;--tx:#1d2a1f;--mut:#667366;--bd:#d9e2d6;--warn:#b3261e;--ok:#2e7d32;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#6fae75;--g2:#4d8553;--bg:#141a15;--card:#1d261e;--tx:#e6efe7;--mut:#9bab9c;--bd:#2d3a2e;--warn:#ff8a80;--ok:#81c784;--in:#222d23;color-scheme:dark}}
:root[data-theme="dark"]{--g:#6fae75;--g2:#4d8553;--bg:#141a15;--card:#1d261e;--tx:#e6efe7;--mut:#9bab9c;--bd:#2d3a2e;--warn:#ff8a80;--ok:#81c784;--in:#222d23;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--in)}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px}
.btn{background:var(--g2);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--g);border:1px solid var(--bd)}.btn.d{background:var(--warn);color:#fff}.btn.s{padding:4px 10px;font-size:13px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#2f5233,#516f4c 60%,#8aa37f)}
.lc{background:var(--card);border-radius:20px;padding:28px;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 40px #0005}
.lc img{width:64px;height:64px;object-fit:contain}.lc small{letter-spacing:.08em;font-weight:700;color:var(--g)}
.lc h1{margin:4px 0;font-size:26px;color:var(--g);line-height:1.15}.lc p.sub{margin:0 0 8px;font-weight:600}
.lc .f{text-align:left}.err{color:var(--warn);min-height:20px;font-size:13px;margin:8px 0}
.lc .btn{width:100%;padding:12px}.cl{font-size:12px;color:var(--mut);margin-top:14px}
#app{display:none}
header{background:var(--g2);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header img{width:30px;height:30px;object-fit:contain}
header b{font-size:15px;line-height:1.2}header span{display:block;font-size:11.5px;opacity:.85;font-weight:400}
.sp{flex:1}.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#fff3;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#9be29f}.dot.off{background:#ffb4ab}
nav{display:flex;gap:6px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
nav button.on{background:var(--g2);color:#fff}
main{padding:18px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{font-size:30px;color:var(--g);display:block}.stat span{color:var(--mut);font-size:13px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.low{background:#b3261e22;color:var(--warn)}.good{background:#2e7d3222;color:var(--ok)}
.q{display:inline-flex;align-items:center;gap:6px}.q button{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:var(--in);cursor:pointer}
dialog{border:0;border-radius:16px;padding:22px;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--tx);max-height:90vh}
dialog::backdrop{background:#0008}.r2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--mut);padding:26px}.dl p{margin:4px 0}.dl b{color:var(--mut);font-weight:600}
h2{margin:0 0 12px;color:var(--g)}
</style>
</head>

const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function setCloud(on){$("dot").className="dot"+(on?"":" off");$("cs").textContent=on?"Cloud database: connected":"Offline mode (saved on this device only)"}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem("cshs_data"));if(x){S.medicines=x.medicines||[];S.students=x.students||[]}}catch(_){}}
function saveLocal(){try{localStorage.setItem("cshs_data",JSON.stringify(S))}catch(_){}}
async function initDb(){
 try{db=window.claude?await claude.use("db"):null}catch(e){db=null}
 if(db){["medicines","students"].forEach(n=>db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({...d.data(),id:d.id}));setCloud(true);render()},()=>setCloud(false)));setCloud(true)}else{setCloud(false);loadLocal();render()}}
async function save(n,o){const id=o.id||uid(n[0]);const d={...o};delete d.id;
 try{if(db)await db.collection(n).doc(id).set(d);else{const i=S[n].findIndex(x=>x.id==id);i<0?S[n].push({...d,id}):S[n][i]={...d,id};saveLocal();render()}}catch(e){alert("Could not save: "+(e.message||e))}}
async function del(n,id){if(!confirm("Are you sure you want to delete this?"))return;
 try{if(db)await db.collection(n).doc(id).delete();else{S[n]=S[n].filter(x=>x.id!=id);saveLocal();render()}}catch(e){alert("Error: "+(e.message||e))}}

$("lf").onsubmit=e=>{e.preventDefault();if($("u").value.trim().toUpperCase()===USER&&$("p").value===PASS){
 $("login").style.display="none";$("app").style.display="block";try{sessionStorage.setItem("cshs","1")}catch(_){}initDb();render()}
 else $("err").textContent="Incorrect username or password."};
$("lo").onclick=()=>{try{sessionStorage.removeItem("cshs")}catch(_){}location.reload()};
$("nav").onclick=e=>{const v=e.target.dataset.v;if(!v)return;view=v;q="";[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.v==v));render()};

function render(){if($("app").style.display!="block")return;const m=$("main");
 if(view=="dash")return dash(m);if(view=="med")return meds(m);stus(m)}
function dash(m){const low=S.medicines.filter(x=>+x.qty<=LOW),exp=S.medicines.filter(x=>x.exp&&new Date(x.exp)<new Date(Date.now()+30*864e5));
 m.innerHTML=`<h2>Dashboard</h2><div class="grid">
 <div class="card stat"><b>${S.students.length}</b><span>Students with health profiles</span></div>
 <div class="card stat"><b>${S.medicines.length}</b><span>Medicines in stock</span></div>
 <div class="card stat"><b style="color:var(--warn)">${low.length}</b><span>Low-stock medicines (≤${LOW})</span></div>
 <div class="card stat"><b style="color:var(--warn)">${exp.length}</b><span>Expiring within 30 days</span></div></div>
 <div class="card"><h3 style="margin-top:0">Low stock / expiring soon</h3>${low.concat(exp.filter(x=>!low.includes(x))).map(x=>`<p>💊 <b>${esc(x.name)}</b> — ${esc(x.qty)} ${esc(x.unit)} ${x.exp?`· exp ${esc(x.exp)}`:""}</p>`).join("")||'<div class="empty">No alerts right now.</div>'}</div>
 <p class="cl" style="color:var(--mut);font-size:13px">☁ Cloud-Based System with a Centralized Database — all data is saved in one central database and can be viewed on any computer that is logged in.</p>`}
function meds(m){const L=S.medicines.filter(x=>(x.name+x.category).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 m.innerHTML=`<h2>Medicine Inventory</h2><div class="bar"><input id="s" placeholder="Search medicine…" value="${esc(q)}"><button class="btn" id="add">+ Add Medicine</button></div>
 <div class="card tw"><table><tr><th>Medicine</th><th>Category</th><th>Stock</th><th>Expiry</th><th>Status</th><th></th></tr>${L.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td>
 <td><span class="q"><button data-a="-" data-id="${x.id}">−</button>${esc(x.qty)} ${esc(x.unit)}<button data-a="+" data-id="${x.id}">+</button></span></td><td>${esc(x.exp||"—")}</td>
 <td><span class="tag ${+x.qty<=LOW?"low":"good"}">${+x.qty<=LOW?"Low stock":"Sufficient"}</span></td><td><button class="btn sec s" data-e="${x.id}">Edit</button> <button class="btn d s" data-d="${x.id}">✕</button></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">No medicines yet. Click “Add Medicine”.</div>'}</div>`;
 $("s").oninput=e=>{q=e.target.value;meds(m);$("s").focus();$("s").setSelectionRange(q.length,q.length)};$("add").onclick=()=>medForm();
 m.onclick=e=>{const t=e.target,id=t.dataset.id;if(t.dataset.a){const x=S.medicines.find(y=>y.id==id);save("medicines",{...x,qty:Math.max(0,+x.qty+(t.dataset.a=="+"?1:-1))})}
 if(t.dataset.e)medForm(S.medicines.find(y=>y.id==t.dataset.e));if(t.dataset.d)del("medicines",t.dataset.d)}}
function medForm(x={}){const d=$("dlg");d.innerHTML=`<form id="f"><h3 style="margin-top:0;color:var(--g)">${x.id?"Edit":"Add"} Medicine</h3>
 <label>Medicine name</label><input name="name" required value="${esc(x.name)}" placeholder="e.g. Paracetamol 500mg">
 <div class="r2"><div><label>Category</label><input name="category" value="${esc(x.category)}" placeholder="e.g. Pain reliever"></div><div><label>Unit</label><input name="unit" value="${esc(x.unit||"tablets")}"></div>
 <div><label>Quantity (stock)</label><input name="qty" type="number" min="0" required value="${esc(x.qty)}"></div><div><label>Expiry date</label><input name="exp" type="date" value="${esc(x.exp)}"></div></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn">Save</button></div></form>`;
 d.showModal();$("f").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(x.id)o.id=x.id;await save("medicines",o);d.close()}}
const SF=[["name","Full name","text",1],["lrn","LRN","text"],["grade","Grade & Strand/Section","text"],["age","Age","number"],["sex","Sex","sel:Male,Female"],["blood","Blood type","sel:,A+,A-,B+,B-,AB+,AB-,O+,O-"],["height","Height (cm)","number"],["weight","Weight (kg)","number"],["allergies","Allergies","area"],["conditions","Conditions / illnesses (e.g. asthma)","area"],["meds","Regular medications","area"],["ec","Emergency contact (name)","text"],["ecn","Emergency contact number","text"],["notes","Additional notes","area"]];
function stus(m){const L=S.students.filter(x=>(x.name+x.lrn+x.grade).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
 m.innerHTML=`<h2>Student Health Profiles</h2><div class="bar"><input id="s" placeholder="Search by name, LRN or section…" value="${esc(q)}"><button class="btn" id="add">+ New Health Profile</button></div>
 <div class="card tw"><table><tr><th>Name</th><th>LRN</th><th>Grade/Section</th><th>Allergies</th><th>Conditions</th><th></th></tr>${L.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.lrn)}</td><td>${esc(x.grade)}</td><td>${esc(x.allergies||"—")}</td><td>${esc(x.conditions||"—")}</td>
 <td><button class="btn sec s" data-v="${x.id}">View</button> <button class="btn sec s" data-e="${x.id}">Edit</button> <button class="btn d s" data-d="${x.id}">✕</button></td></tr>`).join("")}</table>${L.length?"":'<div class="empty">No health profiles yet. Add the first student.</div>'}</div>`;
 $("s").oninput=e=>{q=e.target.value;stus(m);$("s").focus();$("s").setSelectionRange(q.length,q.length)};$("add").onclick=()=>stuForm();
 m.onclick=e=>{const t=e.target,f=id=>S.students.find(y=>y.id==id);if(t.dataset.v)stuView(f(t.dataset.v));if(t.dataset.e)stuForm(f(t.dataset.e));if(t.dataset.d)del("students",t.dataset.d)}}
function stuForm(x={}){const d=$("dlg");d.innerHTML=`<form id="f"><h3 style="margin-top:0;color:var(--g)">${x.id?"Edit":"New"} Health Profile</h3><div class="r2">${SF.map(([k,l,t,r])=>`<div style="${t=="area"?"grid-column:1/-1":""}"><label>${l}</label>${
 t=="area"?`<textarea name="${k}" rows="2">${esc(x[k])}</textarea>`:t.startsWith("sel")?`<select name="${k}">${t.slice(4).split(",").map(o=>`<option ${x[k]==o?"selected":""}>${o}</option>`).join("")}</select>`:`<input name="${k}" type="${t}" ${r?"required":""} value="${esc(x[k])}">`}</div>`).join("")}</div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" class="btn sec" onclick="dlg.close()">Cancel</button><button class="btn">Save to Database</button></div></form>`;
 d.showModal();$("f").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(x.id)o.id=x.id;await save("students",o);d.close()}}
function stuView(x){const d=$("dlg");d.innerHTML=`<h3 style="margin-top:0;color:var(--g)">${esc(x.name)}</h3><div class="dl">${SF.slice(1).map(([k,l])=>`<p><b>${l}:</b> ${esc(x[k]||"—")}</p>`).join("")}</div><div style="text-align:right;margin-top:14px"><button class="btn" onclick="dlg.close()">Close</button></div>`;d.showModal()}

/* ===== CLOUD DATABASE (Firebase Realtime Database) ===== */
const DB_URL="PASTE_YOUR_FIREBASE_DATABASE_URL_HERE";
const cloudOn=()=>/^https:\/\//.test(DB_URL);
const base=()=>DB_URL.replace(/\/$/,"");
let last="";
async function pull(){try{const r=await fetch(base()+"/.json");if(!r.ok)throw new Error(r.status);const j=await r.json()||{};
 const nx={};for(const n of["medicines","students"])nx[n]=Object.entries(j[n]||{}).map(([id,v])=>({...v,id}));
 const s=JSON.stringify(nx);setCloud(true);if(s!==last){last=s;S.medicines=nx.medicines;S.students=nx.students;render()}}
 catch(e){setCloud(false);$("cs").textContent="Cannot reach cloud database"}}
async function initDb(){if(!cloudOn()){loadLocal();setCloud(false);render();return}
 await pull();setInterval(()=>{if(!$("dlg").open)pull()},4000)}
async function save(n,o){const id=o.id||uid(n[0]);const d={...o};delete d.id;
 if(!cloudOn()){const i=S[n].findIndex(x=>x.id==id);i<0?S[n].push({...d,id}):S[n][i]={...d,id};saveLocal();render();return}
 try{const r=await fetch(`${base()}/${n}/${id}.json`,{method:"PUT",body:JSON.stringify(d)});if(!r.ok)throw new Error(r.status);await pull()}
 catch(e){alert("Could not save to the cloud: "+(e.message||e))}}
async function del(n,id){if(!confirm("Are you sure you want to delete this?"))return;
 if(!cloudOn()){S[n]=S[n].filter(x=>x.id!=id);saveLocal();render();return}
 try{const r=await fetch(`${base()}/${n}/${id}.json`,{method:"DELETE"});if(!r.ok)throw new Error(r.status);await pull()}
 catch(e){alert("Error: "+(e.message||e))}}
try{if(sessionStorage.getItem("cshs")){$("login").style.display="none";$("app").style.display="block";initDb();render()}}catch(_){}
</script>
</body>
</html>
